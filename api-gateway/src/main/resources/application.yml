server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter
        - id: chat-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/chat/**, /ws/**
          filters:
            - JwtAuthenticationFilter

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: YourSuperSecretKeyForTeamSyncAI2026MustBe256BitsLong!!
